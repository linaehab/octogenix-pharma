<section class="intro section-wrap reveal" id="about" aria-labelledby="about-title">
  <div class="intro-aside">
    <p class="eyebrow"><span></span>{{ 'about.kicker' | translate }}</p>
    <div class="intro-aside-note">{{ 'about.aside' | translate }}</div>
  </div>
  <div class="intro-content">
    <h2 id="about-title">
      {{ 'about.title' | translate }}
    </h2>
    <div class="intro-bottom">
      <div class="intro-description">
        <p>
        {{ 'about.description' | translate }}
        </p>
        <p>{{ 'about.story' | translate }}</p>
      </div>
      <a class="text-link" routerLink="/services">
        {{ 'about.link' | translate }} <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
  <div class="intro-photo" role="img" [attr.aria-label]="'about.imageAlt' | translate">
    <span class="photo-caption">{{ 'about.caption' | translate }}</span>
  </div>
</section>
