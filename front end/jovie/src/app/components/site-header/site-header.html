<div class="header-frame" [class.is-solid]="isScrolled() || isMenuOpen()">
  <!-- Top bar (desktop): contact details and the language switch -->
  <div class="utility-bar">
    <div class="utility-inner">
      <div class="utility-contact">
        @if (phone(); as phone) {
          <a class="utility-pill" dir="ltr" [href]="phone.href" [attr.aria-label]="('contact.phoneLabel' | translate) + ': ' + phone.label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" /></svg>
            {{ phone.label }}
          </a>
        }
        <a class="utility-link" dir="ltr" [href]="'mailto:' + email()" [attr.aria-label]="('contact.emailLabel' | translate) + ': ' + email()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3zM5.2 7 12 11.5 18.8 7z" /></svg>
          {{ email() }}
        </a>
      </div>
      <button class="language-toggle utility-language" type="button" (click)="toggleLanguage()">
        {{ 'header.switchLanguage' | translate }}
      </button>
    </div>
  </div>

  <header class="site-header" [class.home-route]="isHomePage()">
    <a class="wordmark" routerLink="/" [attr.aria-label]="'header.homeLabel' | translate">
      <span>{{ 'company.name' | translate }}<small>{{ 'header.tagline' | translate }}</small></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="'header.menu' | translate"
      (click)="toggleNavigation()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="primary-navigation"
      class="primary-navigation"
      [class.is-open]="isMenuOpen()"
      [attr.aria-label]="'header.navigation' | translate"
    >
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page" (click)="closeNavigation()">{{ 'header.home' | translate }}</a>
      <a routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page"
         (click)="closeNavigation()">{{ 'header.about' | translate }}</a>
      <div class="services-menu" [class.is-open]="isServicesMenuOpen()">
        <button class="services-trigger" type="button" (click)="toggleServicesMenu()" [attr.aria-expanded]="isServicesMenuOpen()">
          <span>{{ 'header.services' | translate }}</span>
          <span class="services-caret" aria-hidden="true">▾</span>
        </button>
        <div class="services-dropdown" role="menu" aria-label="{{ 'header.services' | translate }}">
          <button type="button" class="dropdown-item" role="menuitem" (click)="selectServicesCategory('customers')">
            {{ 'header.servicesCustomers' | translate }}
          </button>
          <button type="button" class="dropdown-item" role="menuitem" (click)="selectServicesCategory('suppliers')">
            {{ 'header.servicesSuppliers' | translate }}
          </button>
        </div>
      </div>
      <a routerLink="/brands" routerLinkActive="is-active" ariaCurrentWhenActive="page"
         (click)="closeNavigation()">{{ 'header.brands' | translate }}</a>
      <a class="nav-contact" routerLink="/contact" routerLinkActive="is-active"
         ariaCurrentWhenActive="page" (click)="closeNavigation()">
        {{ 'header.contact' | translate }} <span aria-hidden="true">↗</span>
      </a>
      <button class="language-toggle nav-language" type="button" (click)="toggleLanguage()">
        {{ 'header.switchLanguage' | translate }}
      </button>
    </nav>
  </header>
</div>
