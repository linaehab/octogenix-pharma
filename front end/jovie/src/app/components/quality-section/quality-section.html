<section class="quality reveal" aria-labelledby="quality-title">
  <div class="quality-inner section-wrap">
    <div class="quality-photo image-swap">
      <img class="image-swap__primary" src="/assets/images/quality-control-lab.jpg"
        [alt]="'quality.imageAlt' | translate" loading="lazy" />
      <img class="image-swap__alternate" src="/assets/images/value-innovation-lab.jpg" alt="" aria-hidden="true" loading="lazy" />
    </div>
    <div class="quality-symbol" aria-hidden="true">GSDP</div>
    <div class="quality-copy">
      <p class="eyebrow"><span></span>{{ 'quality.kicker' | translate }}</p>
      <h2 id="quality-title">{{ 'quality.title' | translate }}</h2>
      <p class="quality-standard">{{ 'quality.standard' | translate }}</p>
      <p class="quality-description">{{ 'quality.description' | translate }}</p>
    </div>
  </div>
</section>
