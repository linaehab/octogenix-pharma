<section class="quality reveal" aria-labelledby="quality-heading">
  <h2 id="quality-heading" class="quality-heading section-wrap">{{ 'quality.sectionTitle' | translate }}</h2>
  <div class="quality-inner section-wrap">
    <div class="quality-symbol" aria-hidden="true"><span class="quality-shine"></span>GSDP</div>
    <div class="quality-copy">
      <p class="eyebrow"><span></span>{{ 'quality.kicker' | translate }}</p>
      <h3 id="quality-title">{{ 'quality.title' | translate }}</h3>
      <p class="quality-standard">{{ 'quality.standard' | translate }}</p>
    </div>
  </div>
</section>
