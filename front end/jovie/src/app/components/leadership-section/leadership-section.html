<section class="leadership section-wrap" aria-labelledby="leadership-title">
  <header class="leadership-heading reveal">
    <p class="eyebrow"><span></span>{{ 'leadership.kicker' | translate }}</p>
    <h2 id="leadership-title">{{ 'leadership.title' | translate }}</h2>
    <p>{{ 'leadership.description' | translate }}</p>
  </header>

  <!-- Editorial profiles: role and name, set as typography (no placeholder portraits) -->
  <div class="leadership-list" role="list">
    @for (leader of leaders(); track $index; let first = $first) {
      <article class="leader-entry reveal-step" [class.leader-entry--lead]="first" role="listitem">
        <p class="leader-role">{{ leader.role }}</p>
        <h3 class="leader-name">{{ leader.name }}</h3>
        <span class="leader-rule" aria-hidden="true"></span>
      </article>
    }
  </div>
  <p class="portrait-note">{{ 'leadership.portraitNote' | translate }}</p>
</section>
