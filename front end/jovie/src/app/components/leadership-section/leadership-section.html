<section class="leadership section-wrap reveal" aria-labelledby="leadership-title">
  <header class="leadership-heading">
    <p class="eyebrow"><span></span>{{ 'leadership.kicker' | translate }}</p>
    <h2 id="leadership-title">{{ 'leadership.title' | translate }}</h2>
    <p>{{ 'leadership.description' | translate }}</p>
  </header>
  <div class="leadership-list" role="list">
    @for (leader of leaders(); track $index) {
      <article class="leader-entry" role="listitem">
        <span class="leader-arrow" aria-hidden="true">→</span>
        <div class="leader-body">
          <span class="leader-avatar" aria-hidden="true">{{ leader.initials }}</span>
          <div>
            <h3>{{ leader.name }}</h3>
            <p>{{ leader.role }}</p>
          </div>
        </div>
      </article>
    }
  </div>
  <p class="portrait-note">{{ 'leadership.portraitNote' | translate }}</p>
</section>
